[changes]
ignore_conventional_commits = true

[package]
versioned_files = [
    # One entry for Cargo.toml: separate entries for the same file overwrite each other.
    # Internal crates are pinned with `=` so each server release uses the exact versions it was built with.
    { path = "Cargo.toml", regex = [
        "(?m)^version = \"(?<version>\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.]+)?)\"",
        "apollo-mcp-registry = \\{ path = \"crates/apollo-mcp-registry\", version = \"=(?<version>\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.]+)?)\"",
        "apollo-mcp-rhai = \\{ path = \"crates/apollo-mcp-rhai\", version = \"=(?<version>\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.]+)?)\"",
        "apollo-schema-index = \\{ path = \"crates/apollo-schema-index\", version = \"=(?<version>\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.]+)?)\"",
    ] },
    { path = "Cargo.lock", dependency = "apollo-mcp-server" },
    { path = "Cargo.lock", dependency = "apollo-mcp-registry" },
    { path = "Cargo.lock", dependency = "apollo-schema-index" },
    { path = "Cargo.lock", dependency = "apollo-mcp-rhai" },
    { path = "scripts/nix/install.sh", regex = "PACKAGE_VERSION=\"v(?<version>\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.]+)?)\"" },
    { path = "scripts/windows/install.ps1", regex = "\\$package_version = 'v(?<version>\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.]+)?)'" },
    { path = "docs/source/run.mdx", regex = [
        "(^|[^\\w.-])v?(?<version>\\d+\\.\\d+\\.\\d+(-experimental\\.\\d+)?)([^\\w.-]|$)",
        "(^|[^\\w.-])v?(?<version>\\d+\\.\\d+\\.\\d+(-experimental\\.\\d+)?)-rc\\.\\d+([^\\w.]|$)",
    ] },
    { path = "server.json", regex = ["\"version\": \"(?<version>\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.]+)?)\"", "apollo-mcp-server:v(?<version>\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.]+)?)\""] },
]
changelog = "CHANGELOG.md"
assets = "artifacts/*"

[release_notes]
change_templates = [
    "### $summary - @$pr_author_login #$pr_number\n\n$details",
    "- $summary - @$pr_author_login #$pr_number",
]

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git branch -m release/$version"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --set-upstream origin release/$version"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "Release $version"

[workflows.steps.body]
template = "This PR was created by Knope. Merging it will create a new release\n\n$changelog"

[[workflows.steps]]
type = "Command"
command = "gh pr edit --add-label release"
shell = true

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[[workflows]]
name = "get-version"

[[workflows.steps]]
type = "Command"
command = "echo \"$version\""

[[workflows]]
name = "prepare-experimental-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release-temp-$NEW_VERSION-$GIT_RUN_ID"
shell=true

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare experimental release $NEW_VERSION\""
shell=true

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release-temp-$NEW_VERSION-$GIT_RUN_ID"
shell=true

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[github]
owner = "apollographql"
repo = "apollo-mcp-server"