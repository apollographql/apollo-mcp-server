"""
Get a list of astronauts currently in space with their name, nationality, and agency
"""
query GetAstronautsCurrentlyInSpace {
  astronauts(inSpace: true, search: "") {
    results {
      id
      name
      timeInSpace
      lastFlight
      agency {
        name
        abbrev
        country {
          name
        }
      }
      nationality {
        name
        nationalityName
      }
      image {
        thumbnailUrl
      }
    }
  }
}
