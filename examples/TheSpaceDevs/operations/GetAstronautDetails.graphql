query GetAstronautDetails($astronautId: Int!) {
  astronaut(id: $astronautId) {
    id
    name
    status {
      name
    }
    inSpace
    age

    # Birth and career dates
    dateOfBirth
    dateOfDeath
    firstFlight
    lastFlight

    # Space experience metrics
    timeInSpace
    evaTime # Extravehicular Activity time

    # Agency information
    agency {
      id
      name
      abbrev
      country {
        name
        nationalityName
      }
    }

    # Nationality
    nationality {
      name
      nationalityName
      alpha2Code
    }

    # Media
    image {
      imageUrl
      thumbnailUrl
    }

    # Bio and links
    bio
    wiki

    # Social media
    socialMediaLinks {
      url
      socialMediaSite
    }
  }
}
