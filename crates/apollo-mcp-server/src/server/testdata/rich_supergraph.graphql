schema
@link(url: "https://specs.apollo.dev/link/v1.0")
@link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION)
@link(url: "https://example.com/audience/v1.0", import: ["@audience"]) {
    query: RootQuery
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(
    graph: join__Graph
    requires: join__FieldSet
    provides: join__FieldSet
    type: String
    external: Boolean
    override: String
    usedOverridden: Boolean
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(
    graph: join__Graph!
    key: join__FieldSet
    extension: Boolean! = false
    resolvable: Boolean! = true
    isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(
    graph: join__Graph!
    member: String!
) repeatable on UNION

directive @link(
    url: String
    as: String
    for: link__Purpose
    import: [link__Import]
) repeatable on SCHEMA

directive @join__implements(
    graph: join__Graph!
    interface: String!
) repeatable on OBJECT | INTERFACE

scalar join__FieldSet
scalar link__Import

# Federation's API schema strips composed directives; this catches a usage outliving its definition
directive @audience(role: String!) on FIELD_DEFINITION

enum join__Graph {
    CATALOG @join__graph(name: "catalog", url: "http://localhost:4001")
}

enum link__Purpose {
    """
    `SECURITY` features provide metadata necessary to securely resolve fields.
    """
    SECURITY

    """
    `EXECUTION` features provide metadata necessary for operation execution.
    """
    EXECUTION
}

scalar DateTime
    @join__type(graph: CATALOG)
    @specifiedBy(url: "https://scalars.graphql.org/andimarek/date-time")

interface Node @join__type(graph: CATALOG) {
    id: ID!
}

type Product implements Node
    @join__type(graph: CATALOG)
    @join__implements(graph: CATALOG, interface: "Node") {
    id: ID!
    name: String
    releasedAt: DateTime
    price: Int @audience(role: "admin")
}

type Review implements Node
    @join__type(graph: CATALOG)
    @join__implements(graph: CATALOG, interface: "Node") {
    id: ID!
    body: String
}

union SearchResult
    @join__type(graph: CATALOG)
    @join__unionMember(graph: CATALOG, member: "Product")
    @join__unionMember(graph: CATALOG, member: "Review")
= Product | Review

input SearchFilter @join__type(graph: CATALOG) {
    limit: Int = 10
    includeReviews: Boolean = false
}

type RootQuery @join__type(graph: CATALOG) {
    node(id: ID!): Node
    search(term: String!, filter: SearchFilter = {limit: 5}): [SearchResult!]!
}
